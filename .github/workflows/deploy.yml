name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs wait rather than cancel, so a push never
# leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0
          node-version: 22
          cache: npm

      - run: npm ci

      # Parser, codegen and camera maths. No browser, so it costs seconds and
      # blocks a deploy that would ship a broken formula compiler.
      - run: npm test

      - run: npm run build

      # Reads the existing Pages config. It cannot create the site: the
      # workflow token's `pages: write` covers deploying, not provisioning.
      # Enable Pages once, out of band:
      #   gh api -X POST /repos/OWNER/REPO/pages -f build_type=workflow
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
